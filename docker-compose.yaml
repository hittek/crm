services:

  # ─── PostgreSQL with pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hittek-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hittek-crm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── CRM App ─────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_CHATWOOT_URL: ${NEXT_PUBLIC_CHATWOOT_URL}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID}
    image: hittek-crm:latest
    container_name: hittek-crm-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DATABASE_URL to use the postgres service by container name
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm_db}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/data/uploads
    networks:
      - crm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── ngrok tunnel ────────────────────────────────────────────────────────────
  # Static domain — URL never changes across restarts.
  # Inspection UI: http://localhost:4043
  # Port 4043 avoids conflict with YAMS (4042) and homeblinds (4040).
  ngrok:
    image: ngrok/ngrok:latest
    container_name: hittek-crm-ngrok
    command: http --url=${NGROK_DOMAIN:?NGROK_DOMAIN is required} app:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN is required}
    ports:
      - "4043:4040"
    networks:
      - crm-network
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  # ─── Chatwoot Rails (web) ───────────────────────────────────────────────────────────────
  chatwoot-app:
    image: chatwoot/chatwoot:latest
    container_name: hittek-chatwoot-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-https://chatwoot.hittek.mx}
      POSTGRES_DATABASE: ${CHATWOOT_POSTGRES_DB:-chatwoot_production}
      POSTGRES_USERNAME: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - crm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Chatwoot Sidekiq (background jobs) ───────────────────────────────────────────────
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: hittek-chatwoot-sidekiq
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-https://chatwoot.hittek.mx}
      POSTGRES_DATABASE: ${CHATWOOT_POSTGRES_DB:-chatwoot_production}
      POSTGRES_USERNAME: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - crm-network
    depends_on:
      chatwoot-app:
        condition: service_healthy

  # ─── Chatwoot ngrok tunnel ───────────────────────────────────────────────────────────────
  ngrok-chatwoot:
    image: ngrok/ngrok:latest
    container_name: hittek-chatwoot-ngrok
    command: http --url=${NGROK_DOMAIN_CHATWOOT:?NGROK_DOMAIN_CHATWOOT is required} chatwoot-app:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    networks:
      - crm-network
    restart: unless-stopped
    depends_on:
      chatwoot-app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  chatwoot_storage:

networks:
  crm-network:
    driver: bridge
